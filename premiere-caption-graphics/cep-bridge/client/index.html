<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Caption Studio CEP Bridge</title>
    <style>
      body { margin: 0; padding: 10px; background: #1e1e1e; color: #e6e6e6; font: 12px "Segoe UI", sans-serif; }
      h1 { font-size: 13px; margin: 0 0 6px; }
      #status { margin: 6px 0; padding: 6px 8px; border-radius: 4px; background: #262626; border: 1px solid #3a3a3a; }
      #last-eval-label { margin-top: 8px; font-size: 10.5px; color: #999; }
      #last-eval-script { margin: 2px 0 0; background: #161616; border: 1px solid #3a3a3a; border-radius: 4px; padding: 6px 8px; font-family: monospace; font-size: 10.5px; white-space: pre-wrap; word-break: break-all; max-height: 80px; overflow-y: auto; }
      #startup-diagnostics-label { margin-top: 8px; font-size: 10.5px; color: #999; }
      #startup-diagnostics { margin: 2px 0 0; background: #161616; border: 1px solid #3a3a3a; border-radius: 4px; padding: 6px 8px; font-family: monospace; font-size: 10.5px; white-space: pre-wrap; word-break: break-all; max-height: 140px; overflow-y: auto; }
      #legacy-setvalue-section { margin-top: 10px; padding-top: 8px; border-top: 1px solid #3a3a3a; }
      #legacy-setvalue-section label { display: block; font-size: 10.5px; color: #999; margin-bottom: 2px; }
      #legacy-mogrt-path { width: 100%; box-sizing: border-box; font-family: monospace; font-size: 10.5px; padding: 4px; background: #161616; color: #e6e6e6; border: 1px solid #3a3a3a; border-radius: 4px; }
      #legacy-setvalue-btn { margin-top: 6px; font-size: 11.5px; padding: 5px 10px; }
      #legacy-setvalue-result { margin: 6px 0 0; background: #161616; border: 1px solid #3a3a3a; border-radius: 4px; padding: 6px 8px; font-family: monospace; font-size: 10.5px; white-space: pre-wrap; word-break: break-all; max-height: 220px; overflow-y: auto; }
      #log { margin-top: 8px; height: 120px; overflow-y: auto; background: #161616; border: 1px solid #3a3a3a; border-radius: 4px; padding: 6px 8px; font-family: monospace; font-size: 10.5px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Caption Studio CEP Bridge (experimental)</h1>
    <div id="status">Starting…</div>
    <!--
      Task 2: a persistent (not just scrolled-into-the-log) display of the
      exact evalScript() source string most recently sent — updated by
      main.js immediately before every evalScript() call, so it's visible
      in the panel itself without opening DevTools, and stays put even
      after the log has scrolled past it.
    -->
    <div id="last-eval-label">Last evalScript() source sent:</div>
    <pre id="last-eval-script">(none yet)</pre>
    <!--
      Explicit hostscript loader (docs/CEP_BRIDGE_INVESTIGATION.md Part
      16): resolved extension root, resolved hostscript.jsx path, the
      exact $.evalFile() source string, its raw callback, and
      typeof $._captionStudioBridge after loading — kept visible here
      (not just scrolled into the log) since these run once at startup,
      before any command is attempted.
    -->
    <div id="startup-diagnostics-label">Startup diagnostics (extension root, hostscript path, $.evalFile() load):</div>
    <pre id="startup-diagnostics">(none yet)</pre>

    <!--
      docs/CAPTION_GRAPHICS_ARCHITECTURE_DECISION.md's smallest remaining
      proof of concept: the one Source-Text write attempt this
      investigation has never actually reached — ExtendScript's legacy
      ComponentParam.setValue(value, updateUI) two-argument call, tested
      directly against "Keris Master Caption.mogrt" on an older Premiere
      release where CSInterface.evalScript() works. Self-contained here in
      the CEP panel — does not require the UXP extension to be running.
    -->
    <div id="legacy-setvalue-section">
      <label for="legacy-mogrt-path">Full path to "Keris Master Caption.mogrt" (or any test .mogrt):</label>
      <input type="text" id="legacy-mogrt-path" placeholder="C:\path\to\Keris Master Caption.mogrt" />
      <div>
        <button id="legacy-setvalue-btn">Run testLegacySourceTextSetValue</button>
      </div>
      <pre id="legacy-setvalue-result">(not run yet)</pre>
    </div>

    <div id="log"></div>

    <!-- Adobe's official CSInterface library — copied verbatim, do not edit. -->
    <script src="./CSInterface.js"></script>
    <!--
      Plain classic script, not type="module" — same reasoning as the UXP
      panel's dist/main.js (see src/main.js's header comment in the UXP
      extension): keep the execution model as plain and predictable as
      possible for a CEP panel too, and this file is small enough not to
      need bundling.
    -->
    <script src="./main.js"></script>
  </body>
</html>
