<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Caption Graphics Studio</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <!--
      panel-scroll is the ONE scrollable region for the whole panel — header
      (sticky), every section 0-6 (#app, re-rendered by src/ui/render.js),
      and the Log section all live inside it. Deliberately a dedicated div,
      not body/html directly: making body itself the scroll container hits
      a legacy CSS quirk (an html/body with no other wrapper propagates
      body's overflow up to the viewport), which made the sticky header
      above unreliable. See src/style.css for the height/overflow rules.
    -->
    <div id="panel-scroll" class="panel-scroll">
      <header class="app-header">
        <h1>Caption Graphics Studio</h1>
        <p class="subtitle">Transcript &rarr; timed caption chunks &rarr; styled graphics on the timeline</p>
      </header>

      <div id="app"></div>

      <section class="panel panel-log">
        <h2>Log</h2>
        <div class="row">
          <button id="copy-log-btn" class="btn" type="button">Copy Log</button>
          <button id="clear-log-btn" class="btn" type="button">Clear Log</button>
        </div>
        <div id="log-body" class="log-body"></div>
      </section>
    </div>

    <!--
      Plain classic script — do NOT change this to type="module". UXP's
      panel webview does not reliably execute a multi-file
      <script type="module"> import/export graph (confirmed on Premiere
      Pro 26.3: blank panel, zero console output). dist/main.js is a
      single-file bundle produced by `npm run build` (esbuild) from
      src/main.js and everything it imports; see src/main.js's header
      comment and test/entrypoint.test.js.
    -->
    <script src="dist/main.js"></script>
  </body>
</html>
